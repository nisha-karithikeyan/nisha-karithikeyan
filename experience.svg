.dr{animation:dr 16s ease-in-out infinite}
@keyframes dr{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
</style>
<g clip-path="url(#clip)"><rect width="1200" height="500" fill="url(#bg)"/>
<g class="f a1"><rect x="60" y="48" width="6" height="28" rx="3" fill="#9b8fc2"/><text class="s" x="80" y="70" font-size="26" font-weight="700" fill="#2f3440">Experience</text><text class="s" x="80" y="96" font-size="14" fill="#8a8f98">Where I've been building</text></g><circle class="dr" cx="1140" cy="40" r="90" fill="#d6e2d9" opacity=".45"/><circle class="dr" cx="1180" cy="490" r="60" fill="#e8d5d0" opacity=".45" style="animation-delay:3s"/><line class="f a2" x1="110" y1="130" x2="110" y2="470" stroke="#e4ded4" stroke-width="3"/><g class="f a2"><circle cx="110" cy="157" r="11" fill="#d6e2d9" stroke="#8fae9b" stroke-width="3"/><circle cx="110" cy="157" r="4" fill="#8fae9b"><animate attributeName="r" values="3;5;3" dur="2.4s" repeatCount="indefinite"/></circle><rect class="" x="140" y="125" width="1000" height="70" rx="16" fill="#ffffff" stroke="#e4ded4"/><text class="s" x="168" y="155" font-size="17" font-weight="700" fill="#2f3440">Associate Software Engineer</text><text class="s" x="168" y="179" font-size="14" fill="#4f6f5b" font-weight="600">Xenovex Technologies<tspan fill="#8a8f98" font-weight="400">  ·  Government forest-management platform · Angular medical platform · Applied AI</tspan></text><text class="s" x="1116" y="155" text-anchor="end" font-size="13" fill="#8a8f98">Mar 2026 – Present</text></g><g class="f a3"><circle cx="110" cy="245" r="11" fill="#dcd9ea" stroke="#9b8fc2" stroke-width="3"/><rect class="" x="140" y="213" width="1000" height="70" rx="16" fill="#ffffff" stroke="#e4ded4"/><text class="s" x="168" y="243" font-size="17" font-weight="700" fill="#2f3440">Associate Software Engineer (Apprenticeship)</text><text class="s" x="168" y="267" font-size="14" fill="#5d5783" font-weight="600">Kalvium<tspan fill="#8a8f98" font-weight="400">  ·  Software engineering apprenticeship</tspan></text><text class="s" x="1116" y="243" text-anchor="end" font-size="13" fill="#8a8f98">Jan 2026 – Mar 2026</text></g><g class="f a4"><circle cx="110" cy="333" r="11" fill="#e8d5d0" stroke="#c49a91" stroke-width="3"/><rect class="" x="140" y="301" width="1000" height="70" rx="16" fill="#ffffff" stroke="#e4ded4"/><text class="s" x="168" y="331" font-size="17" font-weight="700" fill="#2f3440">Software Developer Intern</text><text class="s" x="168" y="355" font-size="14" fill="#8a5a52" font-weight="600">Paragon Dynamics Info Systems<tspan fill="#8a8f98" font-weight="400">  ·  Frontend development</tspan></text><text class="s" x="1116" y="331" text-anchor="end" font-size="13" fill="#8a8f98">Jun 2024 – Aug 2024</text></g><g class="f a5"><circle cx="110" cy="421" r="11" fill="#efe2c4" stroke="#c9a96b" stroke-width="3"/><rect class="" x="140" y="389" width="1000" height="70" rx="16" fill="#ffffff" stroke="#e4ded4"/><text class="s" x="168" y="419" font-size="17" font-weight="700" fill="#2f3440">Developer Intern</text><text class="s" x="168" y="443" font-size="14" fill="#8a6d3b" font-weight="600">MentorFox.io<tspan fill="#8a8f98" font-weight="400">  ·  Frontend development and UI/UX</tspan></text><text class="s" x="1116" y="419" text-anchor="end" font-size="13" fill="#8a8f98">Feb 2024 – Jul 2024</text></g></g>
