<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440">
<defs><clipPath id="clip"><rect width="1200" height="440" rx="20"/></clipPath><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f4ee"/><stop offset="1" stop-color="#efeae2"/></linearGradient></defs>
<style>
.s{font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif} .m{font-family:Consolas, 'Courier New', monospace}
.f{opacity:0;animation:f 1s ease-out forwards}
.a1{animation-delay:.1s}.a2{animation-delay:.3s}.a3{animation-delay:.5s}.a4{animation-delay:.7s}.a5{animation-delay:.9s}.a6{animation-delay:1.1s}
@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.dr{animation:dr 16s ease-in-out infinite}
@keyframes dr{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
</style>
<g clip-path="url(#clip)"><rect width="1200" height="440" fill="url(#bg)"/>
<g class="f a1"><rect x="60" y="48" width="6" height="28" rx="3" fill="#8fae9b"/><text class="s" x="80" y="70" font-size="26" font-weight="700" fill="#2f3440">About Me</text><text class="s" x="80" y="96" font-size="14" fill="#8a8f98">A little about how I work</text></g><circle class="dr" cx="1140" cy="40" r="90" fill="#d6e2d9" opacity=".45"/><circle class="dr" cx="1180" cy="410" r="60" fill="#e8d5d0" opacity=".45" style="animation-delay:3s"/><rect class="f a2" x="60" y="115" width="640" height="290" rx="16" fill="#ffffff" stroke="#e4ded4"/><g class="f a3"><text class="s" x="90" y="160" font-size="16" fill="#4a505c">I'm a backend-focused engineer who enjoys the parts of software</text><text class="s" x="90" y="188" font-size="16" fill="#4a505c">most people never see: clean data models, reliable APIs, and</text><text class="s" x="90" y="216" font-size="16" fill="#4a505c">systems that keep working when real users arrive.</text><text class="s" x="90" y="244" font-size="16" fill="#4a505c"></text><text class="s" x="90" y="272" font-size="16" fill="#4a505c">At Xenovex I built a government forest-management platform</text><text class="s" x="90" y="300" font-size="16" fill="#4a505c">end-to-end with Django and PostgreSQL, and I'm shaping the</text><text class="s" x="90" y="328" font-size="16" fill="#4a505c">frontend architecture of a production medical platform in Angular.</text><text class="s" x="90" y="356" font-size="16" fill="#4a505c">Outside work I build applied AI tools with FastAPI, Gemini and RAG.</text></g><rect class="f a3" x="730" y="115" width="410" height="135" rx="16" fill="#ffffff" stroke="#e4ded4"/><text class="s f a4" x="760" y="152" font-size="15" font-weight="700" fill="#2f3440">What I work on</text><g class="f a4"><rect x="760" y="168" width="112" height="28" rx="14.0" fill="#d6e2d9"/><text class="s" x="816.0" y="186.32" text-anchor="middle" font-size="12" font-weight="600" fill="#4f6f5b">Backend APIs</text><rect x="882" y="168" width="134" height="28" rx="14.0" fill="#e8d5d0"/><text class="s" x="949.0" y="186.32" text-anchor="middle" font-size="12" font-weight="600" fill="#8a5a52">Database design</text><rect x="760" y="206" width="177" height="28" rx="14.0" fill="#dcd9ea"/><text class="s" x="848.5" y="224.32" text-anchor="middle" font-size="12" font-weight="600" fill="#5d5783">Frontend architecture</text><rect x="947" y="206" width="98" height="28" rx="14.0" fill="#efe2c4"/><text class="s" x="996.0" y="224.32" text-anchor="middle" font-size="12" font-weight="600" fill="#8a6d3b">Applied AI</text></g><rect class="f a4" x="730" y="270" width="410" height="135" rx="16" fill="#ffffff" stroke="#e4ded4"/><text class="s f a5" x="760" y="307" font-size="15" font-weight="700" fill="#2f3440">Right now</text><g class="f a5"><circle cx="766" cy="332" r="4" fill="#8fae9b"/><text class="s" x="780" y="337" font-size="14" fill="#4a505c">Building an order matching engine in .NET</text><circle cx="766" cy="358" r="4" fill="#9b8fc2"/><text class="s" x="780" y="363" font-size="14" fill="#4a505c">Solving DSA problems daily in Python</text><circle cx="766" cy="384" r="4" fill="#c49a91"/><text class="s" x="780" y="389" font-size="14" fill="#4a505c">Open to backend &amp; full-stack roles</text></g></g>
</svg>