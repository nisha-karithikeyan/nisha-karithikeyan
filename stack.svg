" height="28" rx="14.0" fill="#d6e2d9"/><text class="s" x="397.5" y="216.68" text-anchor="middle" font-size="13" font-weight="600" fill="#4f6f5b">Django REST</text><rect x="463" y="198" width="80" height="28" rx="14.0" fill="#dcd9ea"/><text class="s" x="503.0" y="216.68" text-anchor="middle" font-size="13" font-weight="600" fill="#5d5783">FastAPI</text><rect x="553" y="198" width="119" height="28" rx="14.0" fill="#dcd9ea"/><text class="s" x="612.5" y="216.68" text-anchor="middle" font-size="13" font-weight="600" fill="#5d5783">ASP.NET Core</text><rect x="682" y="198" width="96" height="28" rx="14.0" fill="#e8d5d0"/><text class="s" x="730.0" y="216.68" text-anchor="middle" font-size="13" font-weight="600" fill="#8a5a52">REST APIs</text></g><line x1="95" y1="242" x2="1105" y2="242" stroke="#f0ebe3"/><g class="f a4"><text class="s" x="95" y="276" font-size="15" font-weight="700" fill="#2f3440">Databases</text><rect x="260" y="256" width="104" height="28" rx="14.0" fill="#e8d5d0"/><text class="s" x="312.0" y="274.68" text-anchor="middle" font-size="13" font-weight="600" fill="#8a5a52">PostgreSQL</text><rect x="374" y="256" width="65" height="28" rx="14.0" fill="#efe2c4"/><text class="s" x="406.5" y="274.68" text-anchor="middle" font-size="13" font-weight="600" fill="#8a6d3b">MySQL</text><rect x="449" y="256" width="65" height="28" rx="14.0" fill="#e8d5d0"/><text class="s" x="481.5" y="274.68" text-anchor="middle" font-size="13" font-weight="600" fill="#8a5a52">Redis</text><rect x="524" y="256" width="88" height="28" rx="14.0" fill="#dcd9ea"/><text class="s" x="568.0" y="274.68" text-anchor="middle" font-size="13" font-weight="600" fill="#5d5783">pgvector</text></g><line x1="95" y1="300" x2="1105" y2="300" stroke="#f0ebe3"/><g class="f a5"><text class="s" x="95" y="334" font-size="15" font-weight="700" fill="#2f3440">Frontend</text><rect x="260" y="314" width="80" height="28" rx="14.0" fill="#dcd9ea"/><text class="s" x="300.0" y="332.68" text-anchor="middle" font-size="1